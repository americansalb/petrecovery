# PetRecovery.org CI/CD Pipeline
#
# What runs when (2026-11-16, after the account hit its Actions minutes and
# was blocked: 168 runs in half a month, every pull request testing
# everything twice):
#
#   a pull request into pet_main  everything: lint and types, unit tests,
#                                 the game's Postgres checks, the security
#                                 audit, and the production build with its
#                                 startup and memory gate. A pull request
#                                 is tested as merged with pet_main.
#   a push to pet_main            the unit tests only. The pull request
#                                 already ran the rest on the same merge;
#                                 this catches two pull requests that pass
#                                 alone and break together.
#   "Run workflow" by hand        everything, plus the E2E job.
#
# A newer commit on the same pull request (or a newer push to pet_main)
# stops the run it replaces: only the latest result is ever read.

name: CI/CD

on:
  push:
    branches: [pet_main]
  pull_request:
    branches: [pet_main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # SAFETY: force a dummy DB URL for ALL jobs so postinstall (`prisma generate`)
  # and any step can never reach the SHARED remote Render Postgres. A real
  # DATABASE_URL here would let an accidental db op nuke live data on every CI
  # run. Never set repo secrets to the shared DB for CI. (EA/dev msg 465/472.)
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy
  # Dummy auth secret so `next build` (production mode) doesn't throw on a missing
  # NEXTAUTH_SECRET while prerendering. CI-only placeholder, never a real secret.
  NEXTAUTH_SECRET: ci-dummy-secret-not-for-production

jobs:
  # Job 1: Lint and Type Check
  lint:
    name: Lint & Type Check
    # Not on a push to pet_main: its pull request already ran this (see the top).
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Prisma client
        working-directory: frontend
        run: npx prisma generate

      # `|| echo` again: this step could not fail either, and there was no
      # ESLint config at all, so `next lint` was dropping into its
      # interactive setup prompt and the step passed regardless. It had
      # never actually linted anything. It does now, and it fails on errors.
      #
      # The warning ceiling is a ratchet, not a target: it sits just above
      # the current count so the number cannot climb, and should come down
      # as warnings get worked off.
      - name: Run ESLint
        working-directory: frontend
        run: npx next lint --max-warnings=360

      # The type check lives here, not in `next build`: on Render's build
      # machine it ran out of memory at "Checking validity of types" on
      # every deploy after #364, and a bigger heap (#366) was not there to
      # give. The build skips it (next.config.js typescript.ignoreBuildErrors)
      # and this step, with a runner that has the memory, is the gate.
      - name: Type check
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx tsc --noEmit -p tsconfig.json

  # Job 2: Unit Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Prisma client
        working-directory: frontend
        run: npx prisma generate

      # REAL merge gate (blocking): the FULL unit suite must pass. The legacy
      # mockPrisma TDZ failures are repaired; the only excluded file is the
      # pre-Jest logging.test.js (jest.config testPathIgnorePatterns — pending an
      # async-aware rewrite). No coverage threshold here so the gate blocks on
      # correctness/security regressions without flaking on the 20% target.
      # Cleanup timers are now unref'd/cleared; do not hide leaks with forceExit.
      - name: Run unit tests (required)
        working-directory: frontend
        run: npx jest --ci --maxWorkers=2

  # Isolated PostgreSQL: never credentials or network access to the live DB.
  geo-postgres:
    name: Game PostgreSQL release checks
    # Not on a push to pet_main: its pull request already ran this (see the top).
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: launchqa
          POSTGRES_PASSWORD: local-launch-qa-only
          POSTGRES_DB: probablyearth_launch_qa
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U launchqa -d probablyearth_launch_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Create isolated QA schema
        working-directory: frontend
        env:
          DATABASE_URL: postgresql://launchqa:local-launch-qa-only@localhost:55439/probablyearth_launch_qa
        run: npx prisma db push --skip-generate
      - name: Verify queue transactions, recovery and cloud-save conflicts
        working-directory: frontend
        env:
          GEO_PG_TEST_URL: postgresql://launchqa:local-launch-qa-only@localhost:55439/probablyearth_launch_qa
        run: npx jest __tests__/geo/postgres-release.test.js --ci --runInBand

  # Job 3: Build
  build:
    name: Build Application
    # Not on a push to pet_main: its pull request already ran this (see the top).
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    needs: [lint, test, geo-postgres, security]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: launchqa
          POSTGRES_PASSWORD: local-launch-qa-only
          POSTGRES_DB: probablyearth_launch_qa
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U launchqa -d probablyearth_launch_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Prisma client
        working-directory: frontend
        run: npx prisma generate

      # The build is half of every run's minutes. Next keeps its compiled
      # output in .next/cache and reuses what has not changed.
      - name: Restore the Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Build application
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      # A green compilation is not proof that the server survives startup.
      # This gate runs on PRs too, with the same heap cap as production.
      - name: Create isolated startup-test schema
        working-directory: frontend
        env:
          DATABASE_URL: postgresql://launchqa:local-launch-qa-only@localhost:55439/probablyearth_launch_qa
        run: npx prisma db push --skip-generate

      - name: Production startup and two-site memory regression gate
        working-directory: frontend
        timeout-minutes: 5
        env:
          DATABASE_URL: postgresql://launchqa:local-launch-qa-only@localhost:55439/probablyearth_launch_qa
          GEO_DATABASE_URL: postgresql://launchqa:local-launch-qa-only@localhost:55439/probablyearth_launch_qa
        run: node scripts/production-memory-smoke.js

      # Only the E2E job reads this, and it runs only by hand. Uploaded on
      # every run it was hundreds of MB kept for a week each time, which
      # counts against the account's Actions storage.
      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: frontend/.next
          # The path itself is a hidden directory; without this flag v4
          # uploads nothing (with a warning) and the E2E job's download
          # fails with "Artifact not found"
          include-hidden-files: true
          retention-days: 7

  # Job 4: E2E Tests, by hand only ("Run workflow" on the Actions tab). It
  # ran after every merge into pet_main, installing browsers each time, for
  # a Playwright suite that is non-blocking and has never passed without a
  # seeded database; the boot it checks is already the build job's startup
  # gate, which runs on every pull request.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: frontend/.next

      - name: Generate Prisma client
        working-directory: frontend
        run: npx prisma generate

      # The gate: the production build must boot and serve real pages.
      - name: Boot smoke (prod server starts and serves)
        working-directory: frontend
        run: |
          npx next start -p 3000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ -o /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/ -o /dev/null
          curl -sf http://localhost:3000/lost-and-found -o /dev/null
          curl -sf http://localhost:3000/login -o /dev/null
          echo "Boot smoke passed: /, /lost-and-found, /login all serve"
          kill $SERVER_PID || true

      # Non-blocking until CI has a seeded database to make it honest:
      # the specs need real auth + data. Bounded so it cannot eat minutes.
      - name: Run Playwright suite (non-blocking)
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test --config e2e/playwright.config.ts --retries=0 --max-failures=3 || echo "Playwright suite not green yet (needs seeded DB); boot smoke is the gate"

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Job 6: Security Scan
  security:
    name: Security Scan
    # Not on a push to pet_main: its pull request already ran this (see the top).
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `|| echo` made this step incapable of failing, so it reported green
      # through 19 production vulnerabilities including 3 critical ones in
      # the auth chain. It fails now.
      #
      # Production dependencies only: a dev-tool advisory does not ship to
      # anyone, and mixing them in was what made the old output easy to
      # wave through.
      #
      # No package-name exceptions: new advisories must never inherit an old
      # approval. Missing/failed audit responses also block the release.
      - name: Run npm audit
        working-directory: frontend
        run: node scripts/audit-gate.js
