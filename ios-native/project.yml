name: PetRecovery
options:
  bundleIdPrefix: org.petrecovery
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  PetRecovery:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PetRecovery
        excludes:
          - "Resources/Info.plist"
    resources:
      - PetRecovery/Resources/Assets.xcassets
    info:
      path: PetRecovery/Resources/Info.plist
      properties:
        CFBundleDisplayName: PetRecovery
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
          - location-services
          - gps
        NSLocationWhenInUseUsageDescription: >-
          PetRecovery uses your location to track your search path and award
          points for distance covered while looking for a lost pet.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          PetRecovery continues to track your search in the background so your
          progress and points are recorded even if your phone screen is off.
        NSLocationAlwaysUsageDescription: >-
          PetRecovery continues to track your search in the background so your
          progress and points are recorded even if your phone screen is off.
        NSMotionUsageDescription: >-
          PetRecovery uses motion data to distinguish walking from driving so
          only on-foot search distance counts toward your points.
        UIBackgroundModes:
          - location
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.petrecovery.PetRecovery
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
