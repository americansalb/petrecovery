# ReunitePets.org Docker Compose Configuration
# For local development and testing

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: reunitepets-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: reunitepets
      POSTGRES_PASSWORD: reunitepets_dev_password
      POSTGRES_DB: reunitepets
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reunitepets -d reunitepets"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for rate limiting and caching (production)
  redis:
    image: redis:7-alpine
    container_name: reunitepets-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ReunitePets Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reunitepets-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://reunitepets:reunitepets_dev_password@db:5432/reunitepets
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: reunitepets-network
