# PetRecovery.org Docker Compose Configuration
# For local development and testing

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: petrecovery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: petrecovery
      POSTGRES_PASSWORD: petrecovery_dev_password
      POSTGRES_DB: petrecovery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petrecovery -d petrecovery"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for rate limiting and caching (production)
  redis:
    image: redis:7-alpine
    container_name: petrecovery-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PetRecovery Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petrecovery-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://petrecovery:petrecovery_dev_password@db:5432/petrecovery
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=http://localhost:3000
      # No insecure default: a known JWT secret lets anyone forge an ADMIN token.
      # `:?` makes compose fail-fast if NEXTAUTH_SECRET is unset.
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set to a strong random value}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: petrecovery-network
