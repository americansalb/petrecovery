<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ReunitePets</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: #ffffff; color: #0b1020;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
        padding: 24px; gap: 12px;
      }
      h1 { font-size: 20px; margin: 0; }
      p { margin: 0; color: #475569; max-width: 28ch; line-height: 1.5; }
      button {
        margin-top: 8px; padding: 12px 20px; border: 0; border-radius: 999px;
        background: #0b1020; color: #fff; font-size: 16px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!--
      Fallback bundle. The native shell normally loads the live site
      (capacitor.config.ts → server.url); this page only appears if the site
      can't be reached on a cold start (e.g. no connection). Field Mode's real
      offline experience arrives in a later phase.
    -->
    <div class="wrap">
      <h1>ReunitePets</h1>
      <p>Couldn't reach the network. Check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
