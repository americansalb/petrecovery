<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Globe">
  <!-- Probably Earth. A globe, because the answer is always probably Earth. -->
  <circle cx="32" cy="32" r="29" fill="#1b3a5c"/>
  <!-- Meridians and the equator, so it reads as a globe at 16px rather -->
  <!-- than as a blue dot. -->
  <g fill="none" stroke="#7fd4ff" stroke-width="2.2" opacity="0.85">
    <circle cx="32" cy="32" r="29"/>
    <line x1="3" y1="32" x2="61" y2="32"/>
    <ellipse cx="32" cy="32" rx="12.5" ry="29"/>
  </g>
  <!-- Land, kept to three blocks: any more and it turns to mud in a tab. -->
  <g fill="#4ade80">
    <path d="M14 20c5-3 11-3 15 0s2 8-3 9-9 1-12-2-3-5 0-7z"/>
    <path d="M36 14c6 1 10 5 9 9s-6 4-9 7-3 8-7 7-4-7-1-11 2-13 8-12z"/>
    <path d="M22 41c6-2 13-1 17 3s1 9-5 10-14-2-15-7 0-5 3-6z"/>
  </g>
</svg>
