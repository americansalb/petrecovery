  <!-- its own. Most pages draw a real one at /api/geo/og. -->
  <rect width="1200" height="630" fill="#0f2338"/>
  <g transform="translate(600 300)">
    <circle r="150" fill="#1b3a5c"/>
    <g fill="none" stroke="#7fd4ff" stroke-width="6" opacity="0.85">
      <circle r="150"/>
      <line x1="-150" y1="0" x2="150" y2="0"/>
      <ellipse rx="65" ry="150"/>
